<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Segoe UI, Arial, sans-serif">
  <title>Near-exact agreement with the engine's exact lane by correction gate</title>
  <desc>960 audited words (3 prompts x 160 tokens x 2 passes). Gate 0.45: 10 slips, 98.96 percent. Gate 0.30: 12 slips, 98.75 percent. Gate 0.25: 14 slips, 98.54 percent. The quality contract is 97 percent.</desc>
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1a202c">Agreement with the exact lane, 960 words (percent)</text>
  <!-- axis 96..100, 70 px per percent point, baseline y=320 (96) -->
  <g stroke="#d9dee5" stroke-width="1">
    <line x1="70" y1="320" x2="610" y2="320"/><line x1="70" y1="250" x2="610" y2="250"/><line x1="70" y1="180" x2="610" y2="180"/><line x1="70" y1="110" x2="610" y2="110"/><line x1="70" y1="40" x2="610" y2="40"/>
  </g>
  <g font-size="12" fill="#4a5568" text-anchor="end">
    <text x="62" y="324">96</text><text x="62" y="254">97</text><text x="62" y="184">98</text><text x="62" y="114">99</text><text x="62" y="44">100</text>
  </g>
  <line x1="70" y1="250" x2="610" y2="250" stroke="#c05621" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="608" y="243" text-anchor="end" font-size="12" fill="#c05621">97 percent contract</text>
  <rect x="120" y="112.8" width="90" height="207.2" fill="#2b6cb0"/>
  <rect x="270" y="127.5" width="90" height="192.5" fill="#6b9bd1"/>
  <rect x="420" y="142.2" width="90" height="177.8" fill="#9dbfe2"/>
  <g font-size="14" font-weight="600" fill="#1a202c" text-anchor="middle">
    <text x="165" y="104">98.96</text><text x="315" y="119">98.75</text><text x="465" y="134">98.54</text>
  </g>
  <g font-size="13" fill="#1a202c" text-anchor="middle">
    <text x="165" y="342">gate 0.45</text><text x="165" y="358" font-size="11" fill="#4a5568">10 slips (released)</text>
    <text x="315" y="342">gate 0.30</text><text x="315" y="358" font-size="11" fill="#4a5568">12 slips</text>
    <text x="465" y="342">gate 0.25</text><text x="465" y="358" font-size="11" fill="#4a5568">14 slips</text>
  </g>
  <text x="320" y="380" text-anchor="middle" font-size="11" fill="#4a5568">Reference is the engine's own exact correction lane, not the vendor implementation.</text>
  <text x="320" y="394" text-anchor="middle" font-size="11" fill="#4a5568">Near-ties kept by the engine count as slips. Measured 19 Oct 2026.</text>
</svg>
