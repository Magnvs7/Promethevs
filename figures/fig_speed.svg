<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="Segoe UI, Arial, sans-serif">
  <title>Generation speed on DeepSeek-V4.1-Flash-1017, a five-year-old gaming PC</title>
  <desc>Bars show the mean of two runs; dots show each run. Plain exact decoding 2.158 and 2.115 tokens per second (earlier session). Corrected route: code 5.803 and 6.010, reasoning prompt 3.556 and 5.414, agent prompt 4.421 and 4.697.</desc>
  <rect width="680" height="430" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1a202c">Generation speed, 160 new tokens, second pass (tokens/s)</text>
  <!-- gridlines: 33.333 px per tokens/s, baseline y=340 -->
  <g stroke="#d9dee5" stroke-width="1">
    <line x1="70" y1="340" x2="650" y2="340"/>
    <line x1="70" y1="273.3" x2="650" y2="273.3"/>
    <line x1="70" y1="206.7" x2="650" y2="206.7"/>
    <line x1="70" y1="140" x2="650" y2="140"/>
  </g>
  <g font-size="12" fill="#4a5568" text-anchor="end">
    <text x="62" y="344">0</text><text x="62" y="277">2</text><text x="62" y="211">4</text><text x="62" y="144">6</text><text x="62" y="77">8</text>
  </g>
  <line x1="70" y1="73.3" x2="650" y2="73.3" stroke="#c05621" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="648" y="66" text-anchor="end" font-size="12" fill="#c05621">8 tokens/s target (not reached)</text>
  <!-- plain -->
  <rect x="100" y="268.8" width="90" height="71.2" fill="#8a94a3"/>
  <circle cx="145" cy="268.1" r="5" fill="#1a202c"/><circle cx="145" cy="269.5" r="5" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
  <text x="145" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">2.14</text>
  <!-- code -->
  <rect x="235" y="143.1" width="90" height="196.9" fill="#2b6cb0"/>
  <circle cx="280" cy="146.6" r="5" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/><circle cx="280" cy="139.7" r="5" fill="#1a202c"/>
  <text x="280" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">5.91</text>
  <!-- r22 -->
  <rect x="370" y="190.5" width="90" height="149.5" fill="#2b6cb0"/>
  <circle cx="415" cy="221.5" r="5" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/><circle cx="415" cy="159.5" r="5" fill="#1a202c"/>
  <text x="415" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">4.49</text>
  <!-- agent -->
  <rect x="505" y="188" width="90" height="152" fill="#2b6cb0"/>
  <circle cx="550" cy="192.6" r="5" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/><circle cx="550" cy="183.4" r="5" fill="#1a202c"/>
  <text x="550" y="173" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">4.56</text>
  <g font-size="13" fill="#1a202c" text-anchor="middle">
    <text x="145" y="360">Plain exact</text><text x="145" y="376" font-size="11" fill="#4a5568">(earlier session)</text>
    <text x="280" y="360">Code</text><text x="280" y="376" font-size="11" fill="#4a5568">corrected route</text>
    <text x="415" y="360">Reasoning (r22)</text><text x="415" y="376" font-size="11" fill="#4a5568">corrected route</text>
    <text x="550" y="360">Agent</text><text x="550" y="376" font-size="11" fill="#4a5568">corrected route</text>
  </g>
  <g font-size="11" fill="#4a5568">
    <circle cx="90" cy="404" r="4.5" fill="#1a202c"/><text x="100" y="408">higher of two runs</text>
    <circle cx="230" cy="404" r="4.5" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/><text x="240" y="408">lower of two runs</text>
    <text x="360" y="408">Bar and label = mean of the two runs.</text>
    <text x="90" y="424">Expert cache cleared before each pass. Corrected runs 19 Oct 2026; plain runs earlier the same day.</text>
  </g>
</svg>
