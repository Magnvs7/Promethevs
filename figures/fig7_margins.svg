<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" width="840" height="370" font-family="Segoe UI, Arial, sans-serif">
  <title>Corrections by margin and outcome</title>
  <desc>136 corrections made at audit gate 0.9 across the five audited runs of the engine, grouped by the margin of the cheap word in six bands of 0.15. Counts per band, overturned / near-tie kept / agreed: 0 to 0.15: 8 / 4 / 6; 0.15 to 0.30: 7 / 7 / 17; 0.30 to 0.45: 4 / 3 / 10; 0.45 to 0.60: 4 / 1 / 13; 0.60 to 0.75: 4 / 6 / 24; 0.75 to 0.90: 0 / 0 / 18. The engine corrects only words below the 0.45 gate. Overturned words and near-ties kept at or above the gate are the 15 slips counted in the audit.</desc>
  <rect width="840" height="370" fill="#ffffff"/>
  <!-- baseline y=290, 6.5 px per correction; bars x = 90 + 110 i, width 70 -->
  <g stroke="#d9dee5" stroke-width="1">
    <line x1="70" y1="290" x2="790" y2="290"/><line x1="70" y1="225" x2="790" y2="225"/><line x1="70" y1="160" x2="790" y2="160"/><line x1="70" y1="95" x2="790" y2="95"/>
  </g>
  <g font-size="12" fill="#4a5568" text-anchor="end"><text x="62" y="294">0</text><text x="62" y="229">10</text><text x="62" y="164">20</text><text x="62" y="99">30</text></g>
  <text x="18" y="180" font-size="12" fill="#4a5568" text-anchor="middle" transform="rotate(-90 18 180)">Corrections</text>
  <g fill="#1a202c">
    <rect x="90" y="238" width="70" height="52"/><rect x="200" y="244.5" width="70" height="45.5"/><rect x="310" y="264" width="70" height="26"/>
    <rect x="420" y="264" width="70" height="26"/><rect x="530" y="264" width="70" height="26"/>
  </g>
  <g fill="#FFB100" stroke="#1a202c" stroke-width="0.8">
    <rect x="90" y="212" width="70" height="26"/><rect x="200" y="199" width="70" height="45.5"/><rect x="310" y="244.5" width="70" height="19.5"/>
    <rect x="420" y="257.5" width="70" height="6.5"/><rect x="530" y="225" width="70" height="39"/>
  </g>
  <g fill="#cbd5e0">
    <rect x="90" y="173" width="70" height="39"/><rect x="200" y="88.5" width="70" height="110.5"/><rect x="310" y="179.5" width="70" height="65"/>
    <rect x="420" y="173" width="70" height="84.5"/><rect x="530" y="69" width="70" height="156"/><rect x="640" y="173" width="70" height="117"/>
  </g>
  <g font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">
    <text x="125" y="268">8</text><text x="235" y="271">7</text><text x="345" y="281">4</text><text x="455" y="281">4</text><text x="565" y="281">4</text>
  </g>
  <g font-size="12" font-weight="600" fill="#1a202c" text-anchor="middle">
    <text x="125" y="167">18</text><text x="235" y="82">31</text><text x="345" y="173">17</text><text x="455" y="167">18</text><text x="565" y="63">34</text><text x="675" y="167">18</text>
  </g>
  <g font-size="12" fill="#1a202c" text-anchor="middle">
    <text x="125" y="308">0 to 0.15</text><text x="235" y="308">0.15 to 0.30</text><text x="345" y="308">0.30 to 0.45</text><text x="455" y="308">0.45 to 0.60</text><text x="565" y="308">0.60 to 0.75</text><text x="675" y="308">0.75 to 0.90</text>
  </g>
  <text x="430" y="326" font-size="12" fill="#4a5568" text-anchor="middle">Margin of the cheap word (gap between its top two candidates)</text>
  <line x1="400" y1="48" x2="400" y2="290" stroke="#1a202c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g font-size="12" fill="#1a202c">
    <text x="392" y="24" text-anchor="end" font-weight="600">Below the gate: recomputed exactly (66 corrections)</text>
    <text x="408" y="24" font-weight="600">At or above the gate: kept from the 2-bit copy (70)</text>
    <text x="408" y="40" fill="#1a202c">15 slips: 8 overturned words, 7 near-ties kept</text>
  </g>
  <g font-size="12" fill="#1a202c">
    <rect x="90" y="344" width="12" height="12" fill="#1a202c"/><text x="108" y="355">Overturned by the exact path</text>
    <rect x="310" y="344" width="12" height="12" fill="#FFB100" stroke="#1a202c" stroke-width="0.8"/><text x="328" y="355">Near-tie, cheap word kept</text>
    <rect x="510" y="344" width="12" height="12" fill="#cbd5e0"/><text x="528" y="355">Agreed with the exact path</text>
  </g>
</svg>
